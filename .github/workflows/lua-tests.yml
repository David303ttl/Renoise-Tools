name: Lua tool tests
on:
  push:
    branches:
      - feature/arp-subline-timing
  pull_request:

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          find com.david303ttl.ARP.xrnx com.david303ttl.TB303.xrnx tests -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: ARP v0.5 engine and writer tests
        run: lua5.1 tests/arp_v04_spec.lua
      - name: ARP GUI regression
        run: lua5.1 tests/arp_gui_spec.lua
      - name: ARP legacy engine
        run: lua5.1 tests/arp_engine_spec.lua
      - name: TB303 draft model
        run: lua5.1 tests/tb303_sequencer_spec.lua
